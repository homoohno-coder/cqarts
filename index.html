<!DOCTYPE html>
<html lang="en">
<head><meta name="color-scheme" content="light only"><style>:root{color-scheme:light only}</style>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Christina Quarles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ease:cubic-bezier(.22,.61,.36,1)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#0b0907;overflow:hidden}
  .stage{position:fixed;inset:0;overflow:hidden}
  .hero{position:absolute;inset:0;background:url("img/mural-wide.png") center / contain no-repeat;
    animation:rise 2.4s var(--ease) both}
  @keyframes rise{from{opacity:0;filter:brightness(.4) blur(6px)}to{opacity:1;filter:none}}
  /* travelling light across the curved wall and polished floor */
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.7;
    background:linear-gradient(100deg,transparent 30%,rgba(255,226,170,.55) 48%,rgba(255,255,255,.35) 52%,transparent 70%);
    background-size:240% 100%;animation:sheen 16s ease-in-out infinite alternate}
  @keyframes sheen{from{background-position:100% 0}to{background-position:0% 0}}
  /* floor reflections shimmer */
  .floor{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(90deg,rgba(255,170,90,.0) 0 40px,rgba(255,150,80,.28) 70px,rgba(255,255,255,0) 110px);
    background-size:220px 100%;animation:shimmer 9s linear infinite;
    -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
  @keyframes shimmer{from{background-position:0 0}to{background-position:220px 0}}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(8,6,4,.38) 0%,rgba(8,6,4,.12) 38%,rgba(8,6,4,.62) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(3%,3%)}}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;text-align:center;padding:0 5vw}
  .name{font-family:'Cormorant Garamond','Times New Roman',Georgia,serif;font-weight:300;color:#fff;text-decoration:none;
    font-size:clamp(1.8rem,5vw,3.6rem);line-height:.95;letter-spacing:.02em;
    text-shadow:0 2px 30px rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.35);
    opacity:0;animation:nameIn 2.2s var(--ease) .9s forwards;transition:letter-spacing .9s var(--ease),text-shadow .6s;
    -webkit-tap-highlight-color:transparent;cursor:pointer;padding:.2em .3em}
  .name span{display:block}
  .name:hover,.name:focus-visible{letter-spacing:.07em;text-shadow:0 2px 40px rgba(0,0,0,.55),0 0 24px rgba(255,200,120,.35);outline:none}
  @keyframes nameIn{from{opacity:0;transform:translateY(18px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .enter{font:400 .78rem/1 ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,255,255,.82);
    opacity:0;animation:fadeIn 1.6s ease 2.4s forwards}
  .enter i{display:inline-block;width:2.2rem;height:1px;background:currentColor;vertical-align:middle;margin-left:.9rem;transform-origin:left;animation:line 2.4s ease-in-out 3s infinite}
  @keyframes line{0%,100%{transform:scaleX(.4)}50%{transform:scaleX(1)}}
  @keyframes fadeIn{to{opacity:1}}
  .fade{position:fixed;inset:0;background:#0b0907;opacity:0;pointer-events:none;transition:opacity .9s ease}
  .fade.on{opacity:1;pointer-events:all}
  @media (max-width:640px){.name{text-shadow:0 2px 24px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.6)}.enter{text-shadow:0 1px 10px rgba(0,0,0,.8)}.vignette{background:radial-gradient(ellipse at 50% 46%,rgba(8,6,4,.5) 0%,rgba(8,6,4,.25) 45%,rgba(8,6,4,.7) 100%)}}
  @media (max-width: 700px) and (orientation: portrait) {
    .stage{display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center}
    .hero{position:relative;inset:auto;grid-row:2;width:100%;aspect-ratio:1672/941}
    .center{display:contents}
    .name{grid-row:1;align-self:end;margin-bottom:1.25rem;text-align:center}
    .enter{grid-row:3;align-self:start;margin-top:1.5rem}
    .sheen,.floor,.vignette,.grain{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .hero,.sheen,.floor,.grain,.enter i{animation:none}
    .hero{opacity:1;filter:none}
    .name,.enter{animation-duration:.01s;animation-delay:0s}
  }
</style>
<style>
.bars{position:fixed;inset:0;display:flex;pointer-events:none;z-index:50;perspective:1400px}
.bars.on{pointer-events:all}
.bars i{flex:1;background:#f4f2ec;opacity:0;transform:rotateY(0) scaleY(1);transform-origin:50% 50%;will-change:transform,opacity}
.bars.on i{animation:barspin 1.8s cubic-bezier(.45,.05,.25,1) forwards;animation-delay:calc(var(--d)*1ms)}
@keyframes barspin{0%{opacity:0;transform:rotateY(0)}30%{opacity:1}60%{opacity:1}100%{opacity:0;transform:rotateY(360deg)}}
#peek{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:40;visibility:hidden;pointer-events:none;background:#f4f2ec}#peek.show{visibility:visible}
.stage .center{transition:opacity .9s ease}.leaving .stage .center{opacity:0}
@media(prefers-reduced-motion:reduce){.bars.on i{animation:none;opacity:1;transition:opacity .4s}}
</style>
<style>
/* Combined landing: looping gallery video (from the Codex preview) under the original name + Enter transition */
.loop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.6s ease;pointer-events:none}
.stage.video-on .loop{opacity:1}
.stage.video-on .hero,.stage.video-on .sheen,.stage.video-on .floor{opacity:0;transition:opacity 1.6s ease}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(11,9,7,.45),transparent 26%,transparent 58%,rgba(11,9,7,.55))}
.stage.video-on .vignette{opacity:.4}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,4vw,4rem);gap:1rem;font:400 .8rem/1 ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;color:#fff;transition:opacity .9s ease}
.leaving .top,.leaving .foot{opacity:0}
.top .brand{letter-spacing:.14em;text-transform:uppercase;color:#fff;text-decoration:none}
.top details{position:relative}
.top summary{cursor:pointer;list-style:none;padding:.75rem 0;letter-spacing:.14em;text-transform:uppercase}
.top summary::-webkit-details-marker{display:none}
.top .menu{position:absolute;right:0;top:100%;width:min(18rem,calc(100vw - 2rem));display:grid;grid-template-columns:4.5rem 1fr;background:#f4f2ec;color:#242720;box-shadow:0 10px 36px rgba(0,0,0,.4);letter-spacing:0;text-transform:none;font-size:.9rem}
.top .menu img{width:100%;height:100%;object-fit:cover;display:block}
.top .menu nav{display:grid;padding:.6rem 1rem}
.top .menu a{padding:.5rem 0;color:inherit;text-decoration:none}
.top .menu a:hover{text-decoration:underline}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem clamp(1rem,4vw,4rem);font:400 .75rem/1.4 ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;color:rgba(255,255,255,.8);transition:opacity .9s ease}
.foot a{color:inherit;text-underline-offset:.3em}
.foot button{background:none;border:0;color:inherit;font:inherit;min-height:44px;padding:.5rem 0;cursor:pointer}
.top :focus-visible,.foot :focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media(max-width:700px) and (orientation:portrait){.stage .loop{position:relative;grid-row:2;height:auto;aspect-ratio:16/9;object-fit:cover}.stage.video-on .hero{display:none}.stage:after{display:none}}
@media(prefers-reduced-motion:reduce){.loop{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top"><a class="brand" href="./">Christina Quarles</a><details><summary>Menu</summary><div class="menu"><img src="media/gallery-still.jpg" alt=""><nav aria-label="Site"><a href="design-study/#works">Gallery</a><a href="design-study/#exhibitions">Exhibitions</a><a href="design-study/#about">About the artist</a><a href="design-study/cv-archive/">CV &amp; Archive</a></nav></div></details></header>
  <div class="hero" role="img" aria-label="Visitors in a circular gallery surrounded by large paintings by Christina Quarles"></div>
  <video class="loop" id="ambient" muted playsinline loop preload="none" poster="media/gallery-still.jpg" data-src="media/gallery-loop.mp4" aria-hidden="true"></video>
  <div class="sheen"></div><div class="floor"></div><div class="vignette"></div><div class="grain"></div>
  <div class="center">
    <a class="name" id="enter" href="design-study/" aria-label="Enter the Christina Quarles site"><span>Christina</span><span>Quarles</span></a>
    <div class="enter">Enter<i></i></div>
  </div>
  <footer class="foot"><span>Unofficial design study · <a href="https://youtu.be/nESoKuttzB0" target="_blank" rel="noopener">Interview by Hauser &amp; Wirth ↗</a></span><button class="motion" type="button">Pause motion</button></footer>
</main>
<iframe id="peek" tabindex="-1" aria-hidden="true" title=""></iframe><div class="bars" id="bars" aria-hidden="true"></div><div class="fade" id="fade" style="display:none"></div>
<script>
  // Set this to the real main page of the site.
  const ENTER_URL = "design-study/";
  const a = document.getElementById('enter'), fade = document.getElementById('fade');
  a.setAttribute('href', ENTER_URL);
  const bars = document.getElementById('bars'), peek = document.getElementById('peek');
  const warm = () => { peek.src = ENTER_URL; }; if (document.readyState === 'complete') warm(); else addEventListener('load', () => setTimeout(warm, 300));
  const N = innerWidth < 640 ? 14 : 28;
  for (let k = 0; k < N; k++) { const i = document.createElement('i'); const c = Math.abs(k - (N - 1) / 2); i.style.setProperty('--d', Math.round(c * (420 / N) * 2)); bars.appendChild(i); }
  let going = false;
  a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); if (going) return; going = true;
    document.body.classList.add('leaving'); bars.classList.add('on');
    if (!peek.src) peek.src = ENTER_URL;
    setTimeout(() => peek.classList.add('show'), 1000);
    setTimeout(() => location.href = ENTER_URL, 2500);
  });
  document.querySelector('.enter').addEventListener('click', () => a.click());
  document.querySelector('.enter').style.cursor = 'pointer';

  // Looping gallery video: loads after first paint, respects reduced motion, can be paused.
  const stage = document.getElementById('stage'), ambient = document.getElementById('ambient'), motion = document.querySelector('.motion');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = false;
  function ambience() {
    if (paused || reduced.matches) { ambient.pause(); return; }
    if (!ambient.getAttribute('src')) ambient.src = ambient.dataset.src;
    ambient.play().catch(() => { paused = true; motion.textContent = 'Play motion'; });
  }
  ambient.addEventListener('playing', () => stage.classList.add('video-on'));
  ambient.addEventListener('error', () => stage.classList.remove('video-on'));
  reduced.addEventListener('change', ambience);
  motion.addEventListener('click', () => { paused = !paused; motion.textContent = paused ? 'Play motion' : 'Pause motion'; ambience(); });
  if (document.readyState === 'complete') ambience(); else addEventListener('load', ambience);
</script>
</body>
</html>
