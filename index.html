<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Christina Quarles — Selected Work</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f2ec; color: #211e1a; font: 1rem/1.5 system-ui, sans-serif; }
  a { color: inherit; text-underline-offset: .25em; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
  header, main, footer { width: min(92%, 1440px); margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem 2rem; flex-wrap: wrap; padding-block: 1.3rem; border-bottom: 1px solid #c8c2b8; }
  header a { text-decoration: none; }
  header a:hover { text-decoration: underline; }
  nav { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; }
  h1 { margin: 0; font: 400 clamp(3rem, 10.5vw, 10rem)/.95 Georgia, serif; letter-spacing: -.065em; }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 1rem 2rem; flex-wrap: wrap; padding-block: clamp(2.5rem, 7vw, 7rem) 2rem; }
  .gallery-link { display: inline-flex; align-items: center; gap: 1.25rem; padding: .75rem 1rem; border: 1px solid currentColor; text-decoration: none; }
  .gallery-link:hover { background: #211e1a; color: #f4f2ec; }
  h2 { margin: 0 0 1rem; font-size: .83rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .works { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: clamp(1rem, 2.5vw, 2.75rem); align-items: center; }
  figure { margin: 0; min-width: 0; }
  figure:nth-child(2) { margin-top: 2.5rem; }
  figure:nth-child(3) { margin-top: 5rem; }
  .art { aspect-ratio: 1.06; display: grid; background: #e6e1d7; }
  .art img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  figcaption { display: flex; justify-content: space-between; gap: .75rem; margin-top: .65rem; font-size: .9rem; }
  footer { border-top: 1px solid #c8c2b8; margin-top: clamp(2.5rem, 7vw, 6rem); padding-block: 1.2rem; font-size: .82rem; }
  @media (prefers-reduced-motion: no-preference) {
    figure { animation: reveal 1.35s cubic-bezier(.2,.7,.2,1) both; }
    figure:nth-child(2) { animation-delay: .15s; }
    figure:nth-child(3) { animation-delay: .3s; }
    @keyframes reveal { from { opacity: .45; transform: translateY(.85rem) scale(.98); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 700px) {
    .works { grid-template-columns: 1fr 1fr; align-items: start; }
    figure:first-child { grid-column: 1 / -1; }
    figure:nth-child(n+2) { margin-top: 0; }
  }
  @media (max-width: 390px) {
    .works { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <a href="./" aria-current="page">Christina Quarles</a>
  <nav aria-label="Main menu">
    <a href="./design-study/#works">Gallery</a>
    <a href="./design-study/#exhibitions">Exhibitions</a>
    <a href="./design-study/#about">About</a>
    <a href="./design-study/cv-archive/">CV &amp; Archive</a>
  </nav>
</header>
<main>
  <div class="intro">
    <h1>Christina Quarles</h1>
    <a class="gallery-link" href="./design-study/#works">Explore the gallery <span aria-hidden="true">↗</span></a>
  </div>
  <section aria-labelledby="selected">
    <h2 id="selected">Selected work</h2>
    <div class="works">
    <figure>
      <div class="art"><img src="https://media.hauserwirth.com/m/40db2c1aca83dca6/web-hires-jpg-72dpi/QUARL144028-works-grey-background-2.jpg" alt="Tomb (Is My World Not Fallin' Down?), a painting by Christina Quarles" fetchpriority="high" data-fallback="[&quot;https://media.hauserwirth.com/m/40db2c1aca83dca6/webimage-QUARL144028-works-grey-background-2.jpg&quot;,&quot;https://media.hauserwirth.com/m/40db2c1aca83dca6/thul-QUARL144028-works-grey-background-2.jpg&quot;]"></div>
      <figcaption><cite>Tomb (Is My World Not Fallin' Down?)</cite><span>2026</span></figcaption>
    </figure>
    <figure>
      <div class="art"><img src="https://media.hauserwirth.com/m/54510967bd3593bf/web-hires-jpg-72dpi/QUARL145055-works-grey-background-2.jpg" alt="Glow, After, a painting by Christina Quarles" decoding="async" data-fallback="[&quot;https://media.hauserwirth.com/m/54510967bd3593bf/webimage-QUARL145055-works-grey-background-2.jpg&quot;,&quot;https://media.hauserwirth.com/m/54510967bd3593bf/thul-QUARL145055-works-grey-background-2.jpg&quot;]"></div>
      <figcaption><cite>Glow, After</cite><span>2026</span></figcaption>
    </figure>
    <figure>
      <div class="art"><img src="https://media.hauserwirth.com/m/26e7c3def216b660/web-hires-jpg-72dpi/QUARL144027-works-grey-background-2.jpg" alt="Is This The Return to Oz?, a painting by Christina Quarles" decoding="async" data-fallback="[&quot;https://media.hauserwirth.com/m/26e7c3def216b660/webimage-QUARL144027-works-grey-background-2.jpg&quot;,&quot;https://media.hauserwirth.com/m/26e7c3def216b660/thul-QUARL144027-works-grey-background-2.jpg&quot;]"></div>
      <figcaption><cite>Is This The Return to Oz?</cite><span>2026</span></figcaption>
    </figure>
    </div>
  </section>
</main>
<footer>Website design preview</footer>
<script>
  for (const artwork of document.querySelectorAll('img[data-fallback]')) {
    const alternatives = JSON.parse(artwork.dataset.fallback);
    function tryNextSource() {
      const source = alternatives.shift();
      if (source) artwork.src = source;
    }
    artwork.addEventListener('error', tryNextSource);
    if (artwork.complete && !artwork.naturalWidth) tryNextSource();
  }
</script>
</body>
</html>
