      for(let s=-W;s<W*2;s+=14*sc){x.beginPath();x.moveTo(s,0);x.lineTo(s+Math.tan(ang-1)*H,H);x.stroke()}x.restore()}

function paintEvent(seed,S=520){
  const r=mul(seed*977),c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,S);g.addColorStop(0,'#e7dccd');g.addColorStop(1,'#cbbca8');
  x.fillStyle=g;x.fillRect(0,0,S,S);const floor=S*.78;x.fillStyle='#a99880';x.fillRect(0,floor,S,S-floor);
  const n=2+Math.floor(r()*3);
  for(let i=0;i<n;i++){
    const w=S*(.14+r()*.22),h=S*(.2+r()*.3),px=S*(.08+i*(.84/n))+r()*10,py=floor-h-S*(.04+r()*.12);
    x.fillStyle='#f6f1e8';x.fillRect(px-6,py-6,w+12,h+12);
    x.fillStyle=PALETTES[Math.floor(r()*5)][Math.floor(r()*5)];x.fillRect(px,py,w,h);
    x.fillStyle=PALETTES[Math.floor(r()*5)][Math.floor(r()*5)];x.beginPath();x.ellipse(px+w*.5,py+h*.55,w*.3,h*.28,r()*3,0,7);x.fill();

/* random rectangle subdivision: random sizes, tiles the whole area */
function subdivide(x,y,w,h,n,out,rnd){
  if(n<=1||w<70||h<46){out.push({x,y,w,h});return}
  const splitW=(w/h)*(.7+rnd()*.6)>1;
  const r=.28+.44*rnd(),n1=clamp(Math.round(n*(.25+.5*rnd())),1,n-1);
  if(splitW){const w1=w*r;subdivide(x,y,w1,h,n1,out,rnd);subdivide(x+w1,y,w-w1,h,n-n1,out,rnd)}
  else{const h1=h*r;subdivide(x,y,w,h1,n1,out,rnd);subdivide(x,y+h1,w,h-h1,n-n1,out,rnd)}
}

/* ---------- scene ---------- */
const $=id=>document.getElementById(id);
const frame=$('frame'),stage=$('stage'),plane=$('plane'),decor=$('decor'),heroes=$('heroes'),
      fog=$('fog'),head=$('head'),label=$('label'),lt=$('lt'),nameEl=$('name'),root=document.documentElement;
let fw,fh,PW,PH,Yc,camStart,sF,zS=2.6,boxes=[],raf=0,exRaf=0,t0=0,curT=0,lastLabel=-1,mox=0,moy=0,po=38,ex=0,heroSrc=null;

function makeBox(tag){
  const el=document.createElement(tag);el.className='box';
  el.innerHTML='<i class="sd sl"></i><i class="sd sr"></i><i class="sd st"></i><i class="sd sb"></i><div class="fr"></div>';
  return el;
}
const SHADES=['#e6dfd3','#ddd5c8','#ebe5da','#d8cfc1','#e2dacd'];
const LIGHTS=['#cfc8bc','#c4bcaf','#d6d0c5','#bdb4a6','#cbc3b5'];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')';

function setHero(){
  root.style.setProperty('--heroPos',CONFIG.heroPos||'center');
  root.style.setProperty('--nameInk',CONFIG.nameInk||'#fff');
  if(CONFIG.nameShadow)root.style.setProperty('--nameShadow',CONFIG.nameShadow);
  if(CONFIG.hero){root.style.setProperty('--hero','url("'+CONFIG.hero.replace(/"/g,'%22')+'")');return}
  if(!heroSrc){
    const pal=['#f3cfae','#d94f6b','#1f6f78','#f2b632','#2b3a8c','#e2603a','#7fc7b0','#1a1412'];
    heroSrc=paintArt(41,pal,1600,900,26,.2,.5).toDataURL('image/jpeg',.92);
  }
  root.style.setProperty('--hero','url('+heroSrc+')');
}

function build(){
  const W=innerWidth,H=innerHeight;
  fw=Math.floor(Math.min(W,H*16/9));fh=Math.floor(fw*9/16);
  frame.style.cssText='left:'+Math.round((W-fw)/2)+'px;top:'+Math.round((H-fh)/2)+'px;width:'+fw+'px;height:'+fh+'px;font-size:'+fw/100+'px';
  setHero();
  PW=Math.round(fw*1.7);sF=PW*.9/fw;
  const span=fh*sF*zS;PH=Math.round(span+fh*3.4);Yc=Math.round(PH/2);camStart=Yc+span/2+fh*.5;
  plane.style.width=PW+'px';plane.style.height=PH+'px';plane.style.marginLeft=-PW/2+'px';

  const sc=.5,rd=mul(11);decor.width=PW*sc;decor.height=PH*sc;decor.style.width=PW+'px';decor.style.height=PH+'px';
  const d=decor.getContext('2d');d.scale(sc,sc);d.fillStyle='#e9e3d8';d.fillRect(0,0,PW,PH);
  for(let i=0;i<PW*PH/9000;i++){
    const w=18+Math.pow(rd(),2.2)*200,h=18+Math.pow(rd(),2.2)*200;
    d.fillStyle=SHADES[Math.floor(rd()*5)];d.globalAlpha=.55;d.fillRect(rd()*PW,rd()*PH,w,h)}
  d.globalAlpha=1;

  // rectangles tile the whole 16:9 frame (this is the final assembled artwork)
  const rects=[],rnd=mul(5);subdivide(0,0,fw,fh,NBOX,rects,rnd);
  rects.sort((a,b)=>(a.y+a.x*.15)-(b.y+b.x*.15));
  const areas=rects.map(r=>r.w*r.h).sort((a,b)=>a-b),med=areas[areas.length>>1];
  heroes.innerHTML='';boxes=[];
  const nS=CONFIG.series.length,gap=6,mx=fw*.025,top=fh*.15,bot=fh*.035,gW=fw-2*mx,gH=fh-top-bot,sx=gW/fw,sy=gH/fh;
  const px0=PW/2-fw/2,py0=Yc-fh/2;
  let evI=0,alt=0;const artK=Array(nS).fill(0),flightRects=[];
  rects.forEach((r,i)=>{
    const cx=r.x+r.w/2,cy=r.y+r.h/2;
    let filled=rnd()>(r.w*r.h<med?.45:.15),isEv=false,media=null,ev=null,sIdx=Math.min(nS-1,Math.floor(cy/fh*nS));
    if(filled){
      isEv=(alt++%2===0);
      if(isEv){
        ev=CONFIG.events[evI%CONFIG.events.length];evI++;
        if(ev.img)media={url:ev.img};else if(CONFIG.placeholders)media={cnv:paintEvent(i+1)};
      }else{
        const s=CONFIG.series[sIdx],k=artK[sIdx]++;
        if(s.images&&s.images.length)media={url:s.images[k%s.images.length]};
        else if(CONFIG.placeholders)media={cnv:paintArt(i*13+5,PALETTES[sIdx%5])};
      }
      if(!media)filled=false;
    }
    const el=makeBox(isEv&&filled?'a':'div');
    const fr=el.querySelector('.fr'),mm=document.createElement('div');mm.className='m';
    el.style.setProperty('--sc',SHADES[Math.floor(rnd()*5)]);
    el.classList.add(filled?'filled':'empty');
    if(filled){
      el.classList.add(isEv?'ev':'art');
      if(media.url){
        const im=new Image();im.referrerPolicy='no-referrer';im.alt='';
        im.onerror=()=>{el.classList.remove('filled');el.classList.add('empty');el.removeAttribute('href')};
        im.src=media.url;mm.appendChild(im);
      }else mm.appendChild(media.cnv);
      fr.appendChild(mm);
      const cap=document.createElement('div');cap.className='cap';
      if(isEv){
        el.href=ev.href||'#';el.target='_blank';el.rel='noopener noreferrer';
        cap.innerHTML='<b></b><i></i>';cap.firstChild.textContent=ev.title;cap.lastChild.textContent=ev.meta||'';
        const tag=document.createElement('div');tag.className='tag';tag.textContent='Event';
        const ar=document.createElement('div');ar.className='arrow';ar.textContent='↗';
        fr.append(cap,tag,ar);
      }else{
        const s2=CONFIG.series[sIdx],ti=s2.titles&&s2.images&&s2.images.length?s2.titles[(artK[sIdx]-1)%s2.images.length]:null;
        cap.innerHTML='<b></b><i></i>';cap.firstChild.textContent=ti||s2.title;cap.lastChild.textContent=ti?s2.title:'Selected works';fr.appendChild(cap);
      }
    }
    // this tile's slice of the final full-page artwork
    const hs=document.createElement('div');hs.className='hs';
    hs.style.cssText='left:'+(-r.x)+'px;top:'+(-r.y)+'px;width:'+fw+'px;height:'+fh+'px;clip-path:inset(0 100% 0 0)';
    fr.appendChild(hs);
    if(r.w<120||r.h<80)el.classList.add('small');
    heroes.appendChild(el);
    const d0=40+Math.pow(rnd(),1.5)*170,ci=Math.floor(rnd()*5);
    const b={el,mm,hs,filled,isEv,decor:false,d0,dF:d0*.3,c0:hex(SHADES[ci]),c1:hex(LIGHTS[ci]),
      thr:.42+.38*(cx/fw),
      fw_:(r.w-gap)*sF*.9,fh_:(r.h-gap)*sF*.9,
      fL:PW/2+(cx-fw/2)*sF-(r.w-gap)*sF*.45,fT:Yc+(cy-fh/2)*sF*zS-(r.h-gap)*sF*.45,fy:Yc+(cy-fh/2)*sF*zS,
      aL:px0+r.x,aT:py0+r.y,aW:r.w,aH:r.h,
      eL:px0+mx+r.x*sx+gap/2,eT:py0+top+r.y*sy+gap/2,eW:r.w*sx-gap,eH:r.h*sy-gap};

    if(flightRects.some(q=>x<q[2]&&x+w>q[0]&&y<q[3]&&y+h>q[1]))continue;
    const el=makeBox('div');el.style.setProperty('--sc',SHADES[Math.floor(rdc()*5)]);
    const dfr=el.querySelector('.fr');dfr.style.setProperty('--fc',SHADES[Math.floor(rdc()*5)]);

    }

    for(const sc of ['sl','sr','st','sb']){

        const sd=el.querySelector('.'+sc);sd.style.backgroundImage='url("'+artPool[(sideArt++*5+3)%artPool.length]+'")';
        sd.style.backgroundSize='cover';sd.style.backgroundPosition='center';
      }
    }
    heroes.appendChild(el);
    boxes.push({el,decor:true,d0:30+Math.pow(rdc(),1.4)*190,x,y,w,h});placed++;
  }
}

function setPO(){stage.style.perspectiveOrigin=(50+mox)+'% '+(po+moy)+'%'}

function render(t){
  curT=t;
  const fl=clamp((t-1)/7.5),fe=eSine(fl),camY=fl>=1?Yc:lerp(camStart,Yc,fe);
  const flat=eIO(clamp((t-7.6)/3.8)),pitch=lerp(70,60,fe)*(1-flat),m=eIO(clamp((t-8)/3.6));
  plane.style.transform='rotateX('+pitch.toFixed(2)+'deg) translateY('+(-camY).toFixed(1)+'px)';
  stage.style.perspective=lerp(900,1500,Math.max(m*.0,ex)).toFixed(0)+'px';po=lerp(38,50,m);setPO();
  const R=fh*2.4,spanR=fh*.9,snap=m>=1;
  for(const b of boxes){
    const el=b.el;
    if(b.decor){
      if(m>.98){el.style.display='none';continue}
      el.style.display='';
      el.style.setProperty('--w',b.w+'px');el.style.setProperty('--h',b.h+'px');el.style.setProperty('--d',(b.d0*(1-m)).toFixed(1)+'px');
      el.style.transform='translate3d('+b.x.toFixed(1)+'px,'+b.y.toFixed(1)+'px,0)';continue;
    }
    let L=lerp(lerp(b.fL,b.aL,m),b.eL,ex),T=lerp(lerp(b.fT,b.aT,m),b.eT,ex),
        W=lerp(lerp(b.fw_,b.aW,m),b.eW,ex),Hh=lerp(lerp(b.fh_,b.aH,m),b.eH,ex);
    if(snap){ // crisp pixel-snapped edges; 1px overlap when assembled so no hairline gaps
      const l=Math.round(L),tt=Math.round(T),r=Math.round(L+W),bb=Math.round(T+Hh),ov=ex<.002?1:0;
      L=l;T=tt;W=r-l+ov;Hh=bb-tt+ov;
    }
    el.style.setProperty('--w',W.toFixed(1)+'px');el.style.setProperty('--h',Hh.toFixed(1)+'px');
    el.style.setProperty('--d',lerp(lerp(b.d0,0,m),b.dF,ex).toFixed(1)+'px');
    el.style.transform='translate3d('+L.toFixed(1)+'px,'+T.toFixed(1)+'px,0)';
    // own image reveal during the flight

      const p=t>=8.2?1:clamp((R-(camY-b.fy))/spanR),pe=eSine(p);
      b.mm.style.clipPath='inset(0 '+((1-pe)*100).toFixed(1)+'% 0 0)';
      b.mm.style.transform='scale('+(1.18-.18*pe).toFixed(3)+')';
      el.style.setProperty('--e',(Math.sin(pe*Math.PI)*.9*(1-m)).toFixed(3));
    }else{
      const col=mix(b.c0,b.c1,ex);el.style.setProperty('--sc',col);el.style.setProperty('--fc',col);
    }
    el.style.setProperty('--c',clamp((ex-.6)/.4).toFixed(2));
    // crisp wipe of the final artwork across the tiles, left to right
    const pw=snap?1:clamp((m-b.thr)/.16),hp=pw*(1-ex);
    b.hs.style.clipPath=hp<=0?'inset(0 100% 0 0)':'inset(0 '+((1-hp)*100).toFixed(2)+'% 0 0)';
  }
  const a=[236,230,219],c=[217,211,201],bgc='rgb('+a.map((v,i)=>Math.round(lerp(v,c[i],ex))).join(',')+')';
  root.style.setProperty('--bg',bgc);
  decor.style.opacity=(1-m).toFixed(3);fog.style.opacity=(1-m).toFixed(3);
  nameEl.style.opacity=(clamp((t-11.2)/1.2)*(1-clamp(ex*2.2))).toFixed(3);
  head.style.opacity=clamp((ex-.6)/.4).toFixed(2);$('note').style.opacity=head.style.opacity;
  document.body.classList.toggle('light',ex>.5);
  frame.classList.toggle('live',ex>=.95);
  const span=fh*sF*zS,rel=clamp((camY-fh*.9-(Yc-span/2))/span),sIdx=Math.min(CONFIG.series.length-1,Math.floor(rel*CONFIG.series.length));
  label.style.opacity=(t>1.4&&t<8.4)?1:0;
  if(sIdx!==lastLabel){lastLabel=sIdx;lt.textContent=CONFIG.series[sIdx].title}
}
function loop(now){const t=(now-t0)/1000;if(t>=TEND){render(TEND);raf=0;return}render(t);raf=requestAnimationFrame(loop)}
function play(from){cancelAnimationFrame(raf);cancelAnimationFrame(exRaf);ex=0;setExploreLabel();t0=performance.now()-(from||0)*1000;lastLabel=-1;raf=requestAnimationFrame(loop)}
function finish(){cancelAnimationFrame(raf);raf=0;render(TEND)}

function setExploreLabel(){$('explore').textContent=ex>.5||exTarget===1?'Back to artwork':'Explore events'}
let exTarget=0;
function animEx(to){
  if(raf)finish();
  cancelAnimationFrame(exRaf);exTarget=to;setExploreLabel();
  const from=ex,st=performance.now();
  (function step(now){const u=clamp((now-st)/1500);ex=lerp(from,to,eIO(u));render(TEND);if(u<1)exRaf=requestAnimationFrame(step);else setExploreLabel()})(st);
  if(!to){mox=0;moy=0}
}
$('explore').onclick=()=>animEx(exTarget?0:1);
$('home').onclick=e=>{e.preventDefault();if(ex>.5||exTarget===1)animEx(0)};
$('replay').onclick=()=>{exTarget=0;play(0)};
$('skip').onclick=()=>{exTarget=0;ex=0;finish();setExploreLabel()};
$('imgs').onclick=()=>$('panel').classList.toggle('open');
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();$('skip').click()}});
frame.addEventListener('pointermove',e=>{
  if(ex<.95)return;const r=frame.getBoundingClientRect();
  mox=((e.clientX-r.left)/r.width-.5)*26;moy=((e.clientY-r.top)/r.height-.5)*26;setPO();
});

function fillPanel(){
  if(CONFIG.placeholders)return;
  $('heroUrl').value=CONFIG.hero||'';
  $('artUrls').value=CONFIG.series.flatMap(s=>s.images).join('\n');
  $('evUrls').value=CONFIG.events.filter(e=>e.img||e.href!=='#').map(e=>[e.img||'',e.title,e.meta||'',e.href||''].join(' | ')).join('\n');
}
$('apply').onclick=()=>{
  const hero=$('heroUrl').value.trim();
  const art=$('artUrls').value.split('\n').map(s=>s.trim()).filter(s=>/^https?:/i.test(s));
  const evs=$('evUrls').value.split('\n').map(s=>s.trim()).filter(Boolean).map((l,i)=>{
    const p=l.split('|').map(s=>s.trim());return{img:/^https?:/i.test(p[0])?p[0]:null,title:p[1]||'Event '+String(i+1).padStart(2,'0'),meta:p[2]||'',href:p[3]||'#'}});
  if(!hero&&!art.length&&!evs.length)return;
  CONFIG.hero=/^https?:/i.test(hero)?hero:null;
  CONFIG.series.forEach(s=>s.images=[]);art.forEach((u,j)=>CONFIG.series[j%CONFIG.series.length].images.push(u));
  if(evs.length)CONFIG.events=evs;
  CONFIG.placeholders=!(art.length||evs.length);
  try{localStorage.setItem('cqcfg2',JSON.stringify(CONFIG))}catch(e){}
  $('panel').classList.remove('open');build();exTarget=0;play(0);
};
$('reset').onclick=()=>{try{localStorage.removeItem('cqcfg2')}catch(e){}location.reload()};

let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{build();render(raf?curT:TEND)},150)});
if(CONFIG.tools===false){$('imgs').style.display='none';$('panel').remove()}else fillPanel();
build();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)render(TEND);else play(0);
</script>
